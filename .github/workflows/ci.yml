name: Rust CI

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and example
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run simulator example
        run: cargo run -p engine-core --example simulator_demo

      - name: Run finite-state environment example
        run: cargo run -p engine-core --example finite_state_demo
